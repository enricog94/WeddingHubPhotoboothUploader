[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "weddinghub-photobooth"
version = "0.1.0"
description = "WeddingHub Photobooth Uploader - reliable, offline-first background uploader for PhotoboothProject"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "WeddingHub Team" }
]
dependencies = [
    "watchdog>=4.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
]

[project.scripts]
weddinghub-photobooth = "weddinghub_photobooth.cli:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

